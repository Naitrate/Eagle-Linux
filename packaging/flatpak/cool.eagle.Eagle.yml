app-id: cool.eagle.Eagle
runtime: org.freedesktop.Platform
runtime-version: '23.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '23.08'
command: eagle
finish-args:
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=ipc
  - --share=network
  - --device=all
  - --filesystem=host
  - --talk-name=org.kde.kglobalaccel
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.Flatpak
  - --env=GTK_USE_PORTAL=1

modules:
  - name: electron-binary
    buildsystem: simple
    build-commands:
      - mkdir -p /app/electron
      - cp -r . /app/electron/
      - chmod +x /app/electron/electron
      - mkdir -p /app/bin
      - ln -sf /app/electron/electron /app/bin/electron
    sources:
      - type: archive
        url: https://github.com/electron/electron/releases/download/v22.3.7/electron-v22.3.7-linux-x64.zip
        sha256: a04a8e95032e13808c6da3a244739edecbdb25e34accc8a8a53db257f225a5c9
        # The Electron zip already has its payload at the root, so the default
        # strip-components of 1 flattens locales/ and resources/ into /app/electron.
        # Electron then cannot find its locale paks ("locale_file_path.empty()")
        # and aborts with exit 1 before the app ever loads.
        strip-components: 0

  # The runtime already provides ffmpeg and ffprobe, but not exiv2, which the
  # Exif Metadata plugin needs. The rpm, Arch and Nix packages declare exiv2 as
  # a dependency for the same reason; inside the sandbox it has to be built.
  # Note this archive has a top-level directory, so the default
  # strip-components of 1 is correct here, unlike the Electron zip above.
  - name: exiv2
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DEXIV2_BUILD_SAMPLES=OFF
      - -DEXIV2_BUILD_UNIT_TESTS=OFF
      - -DEXIV2_ENABLE_NLS=OFF
      - -DEXIV2_ENABLE_VIDEO=OFF
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://github.com/Exiv2/exiv2/releases/download/v0.27.7/exiv2-0.27.7-Source.tar.gz
        sha256: 70629dc27e3d4dd5c3fa91afbea93166d338b1de284e6a4c44bbf9dcfe7bbc6d

  - name: eagle
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/share/eagle /app/share/applications /app/share/icons/hicolor/512x512/apps /app/share/pixmaps /app/share/metainfo
      - cp -r app /app/share/eagle/
      - cp patch.js /app/share/eagle/
      - cp -r patches /app/share/eagle/
      - install -Dm755 packaging/appimage/AppRun /app/bin/eagle
      - cp app/assets/icon.png /app/share/icons/hicolor/512x512/apps/cool.eagle.Eagle.png
      - cp app/assets/icon.png /app/share/pixmaps/cool.eagle.Eagle.png
      - install -Dm644 packaging/flatpak/cool.eagle.Eagle.desktop /app/share/applications/cool.eagle.Eagle.desktop
      - install -Dm644 packaging/flatpak/cool.eagle.Eagle.metainfo.xml /app/share/metainfo/cool.eagle.Eagle.metainfo.xml
    sources:
      - type: dir
        path: ../..
