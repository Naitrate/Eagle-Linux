name: Publish Flatpak OSTree Repository to GitHub Pages

on:
  push:
    tags:
      - 'v*'
      - '*.*.*'
  workflow_dispatch:

jobs:
  publish-flatpak-repo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree python3

      - name: Setup Flatpak Flathub Runtimes
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Sdk//23.08 org.freedesktop.Platform//23.08 org.electronjs.Electron2.BaseApp//23.08

      - name: Extract Upstream Eagle Payload
        run: |
          bash ./packaging/ensure-extracted-app.sh

      # An unsigned OSTree repo forces everyone installing from it to pass
      # --no-gpg-verify, which is both awkward and a real downgrade: without a
      # signature there is nothing tying the objects served over Pages to this
      # build. The private key is held as a repository secret, so CI can sign
      # without the key ever living in the tree.
      - name: Import the repository signing key
        id: signing
        env:
          FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "${FLATPAK_GPG_PRIVATE_KEY:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned Flatpak repository::FLATPAK_GPG_PRIVATE_KEY is not set. Publishing an unsigned repo; users will have to add it with --no-gpg-verify."
            exit 0
          fi

          GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          export GNUPGHOME
          printf '%s' "${FLATPAK_GPG_PRIVATE_KEY}" | gpg --batch --quiet --import

          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "${KEYID}" ]; then
            echo "::error::FLATPAK_GPG_PRIVATE_KEY was set but no secret key could be imported from it."
            exit 1
          fi

          echo "signed=true"              >> "$GITHUB_OUTPUT"
          echo "keyid=${KEYID}"           >> "$GITHUB_OUTPUT"
          echo "gnupghome=${GNUPGHOME}"   >> "$GITHUB_OUTPUT"
          echo "Signing with ${KEYID}"

      - name: Build Flatpak OSTree Repository
        env:
          SIGNED: ${{ steps.signing.outputs.signed }}
          KEYID: ${{ steps.signing.outputs.keyid }}
          GNUPGHOME: ${{ steps.signing.outputs.gnupghome }}
        run: |
          rm -rf build/flatpak-repo build/flatpak-build
          mkdir -p build/flatpak-repo

          SIGN_ARGS=""
          if [ "${SIGNED}" = "true" ]; then
            SIGN_ARGS="--gpg-sign=${KEYID} --gpg-homedir=${GNUPGHOME}"
          fi

          flatpak-builder --force-clean ${SIGN_ARGS} --repo=build/flatpak-repo build/flatpak-build packaging/flatpak/cool.eagle.Eagle.yml

          # Generate summary index for OSTree repo. The summary has to carry a
          # signature too, otherwise clients reject the repo even though the
          # individual commits are signed.
          flatpak build-update-repo ${SIGN_ARGS} build/flatpak-repo

          # Disable Jekyll processing on GitHub Pages so dotfiles & OSTree objects are served
          touch build/flatpak-repo/.nojekyll

          # Create HTML index page so browser visits render cleanly
          cat << 'EOF' > build/flatpak-repo/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <title>Eagle Linux Flatpak Repository</title>
              <style>
                  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; text-align: center; padding: 50px 20px; line-height: 1.6; }
                  h1 { color: #38bdf8; }
                  code { background: #1e293b; padding: 4px 8px; border-radius: 4px; color: #38bdf8; font-family: monospace; }
                  pre { background: #1e293b; padding: 20px; border-radius: 8px; display: inline-block; text-align: left; max-width: 650px; overflow-x: auto; border: 1px solid #334155; }
                  a { color: #38bdf8; text-decoration: none; }
                  a:hover { text-decoration: underline; }
              </style>
          </head>
          <body>
              <h1>Eagle Linux Flatpak Repository</h1>
              <p>Official static OSTree repository for <a href="https://github.com/Naitrate/Eagle-Linux">Eagle Linux Port</a>.</p>
              <h2>Installation Instructions</h2>
              <pre><code># 1. Add the Flatpak repository
              flatpak remote-add --user --if-not-exists eagle-repo https://naitrate.github.io/Eagle-Linux/eagle.flatpakrepo

              # 2. Install Eagle
              flatpak install --user eagle-repo cool.eagle.Eagle</code></pre>
          </body>
          </html>
          EOF

          # The .flatpakrepo descriptor carries the public half of the signing
          # key, base64 encoded on a single line. That is what lets a client
          # verify the repo from a plain `flatpak remote-add` with no extra
          # flags. Without a key we have to keep advertising GPGVerify=false.
          cat << 'EOF' > build/flatpak-repo/eagle.flatpakrepo
          [Flatpak Repo]
          Title=Eagle Linux Repository
          Url=https://naitrate.github.io/Eagle-Linux/
          Homepage=https://github.com/Naitrate/Eagle-Linux
          Comment=Official Flatpak repository for Eagle Linux
          EOF

          if [ "${SIGNED}" = "true" ]; then
            {
              echo "GPGVerify=true"
              echo "GPGKey=$(gpg --homedir "${GNUPGHOME}" --export "${KEYID}" | base64 -w0)"
            } >> build/flatpak-repo/eagle.flatpakrepo
            echo "[INFO] Published a signed repository."
          else
            echo "GPGVerify=false" >> build/flatpak-repo/eagle.flatpakrepo
            echo "[WARN] Published an UNSIGNED repository."
          fi

      - name: Deploy OSTree Repository to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/flatpak-repo
          branch: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
